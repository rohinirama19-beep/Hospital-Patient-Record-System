<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Patient Record System — Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <h1>Patient Record System</h1>
      <p>Oracle COE Academic Project — Authorized Access</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="user@hospital.org" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary login-btn" id="loginBtn">Sign In</button>
    </form>

    <div class="demo-credentials">
      <p><strong>Evaluation Demo Credentials:</strong></p>
      <p style="margin-top: 4px;">Admin: <code>admin@hospital.org</code> / <code>admin123</code></p>
      <p style="margin-top: 2px;">Staff: <code>staff@hospital.org</code> / <code>staff123</code></p>
    </div>
  </div>

  <div id="globalToast" class="alert-box"></div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
